name: CI

# Runs on pull requests and on pushes to main. The API tests are
# self-contained unit tests (mocked clients) and do NOT require the Floci
# emulators to be running.
#
# Changes that only touch documentation or repository metadata cannot affect
# lint, type-check, tests or the build, so they do not start this workflow.
# The main ruleset requires no status checks, so a skipped run never blocks
# a merge.

on:
  pull_request:
    paths-ignore: &docs-only
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/changelog-guard.yml'
      - '.github/workflows/pr-hygiene.yml'
      - '.github/workflows/pr-limit.yml'
      - '.github/workflows/release-please.yml'
      - '.github/workflows/release.yml'
      - '.release-please-manifest.json'
      - 'release-please-config.json'
  push:
    branches:
      - main
    paths-ignore: *docs-only

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type-check, test, build
    # The release-please PR only bumps versions and the CHANGELOG on top of
    # main, which was already tested on push, and it is rebuilt after every
    # merge to main. Only a branch in this repository gets the exemption.
    if: >-
      !(github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.head_ref, 'release-please--branches--main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7.0.1

      # ── Frontend toolchain (pnpm workspace) ────────────────────────────────
      - uses: pnpm/action-setup@v6
        with:
          version: 9.2.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # ── API toolchain (bun) — needed for tests and type-check ──────────────
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1'

      - name: Install API dependencies
        working-directory: packages/api
        run: bun install --frozen-lockfile

      # ── Checks ─────────────────────────────────────────────────────────────
      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Install browser for frontend tests
        run: pnpm --filter @floci/frontend exec playwright install --with-deps chromium

      - name: Test frontend workspaces
        run: pnpm --filter @floci/frontend test:e2e

      - name: Build
        run: pnpm build

      # Lint is non-blocking for now: main has pre-existing
      # react-hooks/rules-of-hooks violations in NetworkingPanel.tsx. Drop
      # continue-on-error once those are fixed to make lint gate PRs.
      - name: Lint
        run: pnpm lint
        continue-on-error: true
