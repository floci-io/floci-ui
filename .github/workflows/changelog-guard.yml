name: Changelog Guard

# CHANGELOG.md is generated by release-please (release-please.yml): a
# contributor's Conventional Commit message IS the changelog entry, so PRs
# must not edit the file by hand. release-please's own release PR is the one
# writer and is exempt: only its branch, release-please--branches--main (plus a
# --components--<name> suffix when release-please names the package), and only
# when that branch lives in this repository (a fork can name a branch anything;
# pushing a branch here needs write access). Genuine
# corrections (typos in history, security notes) are allowed by adding the
# `changelog-edit` label to the PR.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'CHANGELOG.md'

permissions: {}

jobs:
  guard:
    name: CHANGELOG.md is generated
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'changelog-edit') && !(github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'release-please--branches--main' || startsWith(github.head_ref, 'release-please--branches--main--components--'))) }}
    steps:
      - name: Reject hand edits
        run: |
          echo "::error::CHANGELOG.md is generated by release-please: your Conventional Commit message is the changelog entry. Remove the CHANGELOG.md changes from this PR, or ask a maintainer for the 'changelog-edit' label if this is a genuine correction."
          exit 1
